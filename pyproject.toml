[project]
name = "loreconvo"
version = "0.8.4"
description = "Cross-surface persistent memory for Claude sessions. Vault conversations from Code, Cowork, and Chat -- recall decisions, artifacts, and context in any future session."
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Labyrinth Analytics Consulting" }
]
keywords = ["mcp", "claude", "memory", "sessions", "cross-surface", "ai-tools", "claude-plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]

dependencies = [
    "mcp[cli]==1.27.0",
    "starlette==1.3.1",
    "click==8.3.3",
    "cryptography==49.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]
pro = [
    "lancedb==0.30.2",
    "sentence-transformers==5.5.0",
    "pyarrow==24.0.0",
]
bridge = [
    "anthropic==0.87.0",
]

[project.scripts]
loreconvo = "loreconvo.server:main"
loreconvo-compat-check = "loreconvo.compat_check:main"

[project.urls]
Homepage = "https://github.com/labyrinth-analytics/loreconvo"
Repository = "https://github.com/labyrinth-analytics/loreconvo"
"Bug Tracker" = "https://github.com/labyrinth-analytics/loreconvo/issues"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# src/ IS the loreconvo package (flat structure: src/server.py, src/core/, etc.)
# This maps `loreconvo` -> src/ so that `loreconvo.server:main` resolves correctly.
[tool.setuptools]
packages = ["loreconvo", "loreconvo.core"]

[tool.setuptools.package-dir]
"loreconvo" = "src"
"loreconvo.core" = "src/core"
