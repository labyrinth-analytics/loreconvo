[project]
name = "loreconvo"
version = "0.7.1"
description = "Cross-surface persistent memory for Claude sessions. Vault conversations from Code, Cowork, and Chat -- recall decisions, artifacts, and context in any future session."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Labyrinth Analytics Consulting" }
]
keywords = ["mcp", "claude", "memory", "sessions", "cross-surface", "ai-tools", "claude-plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]

dependencies = [
    "mcp[cli]>=1.0.0",  # allow-range: mcp -- marketplace requires >=1.0.0, pinning to a single version breaks Claude Code installs
    "click>=8.0.0",  # allow-range: click -- CLI dep, major API stable since 8.0
    "cryptography>=41.0.0",  # allow-range: cryptography -- security lib, must allow patches for CVE coverage
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",  # allow-range: pytest -- dev-only, not shipped to marketplace
    "pytest-asyncio>=0.21",  # allow-range: pytest-asyncio -- dev-only, not shipped to marketplace
]
pro = [
    "lancedb==0.30.2",
    "sentence-transformers==5.5.0",
    "pyarrow==24.0.0",
]
bridge = [
    "anthropic==0.87.0",
]

[project.scripts]
loreconvo = "loreconvo.server:main"

[project.urls]
Homepage = "https://github.com/labyrinth-analytics/loreconvo"
Repository = "https://github.com/labyrinth-analytics/loreconvo"
"Bug Tracker" = "https://github.com/labyrinth-analytics/loreconvo/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# src/ IS the loreconvo package (flat structure: src/server.py, src/core/, etc.)
# This maps `loreconvo` -> src/ so that `loreconvo.server:main` resolves correctly.
[tool.setuptools]
packages = ["loreconvo", "loreconvo.core"]

[tool.setuptools.package-dir]
"loreconvo" = "src"
"loreconvo.core" = "src/core"
