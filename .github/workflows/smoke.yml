# Cross-platform MCP stdio smoke test (SH-105964).
#
# Starts the MCP server over stdio on Linux / macOS / Windows and runs a
# save -> search -> recall round trip, so the "install check: Linux, macOS,
# Windows" claim stays continuously true. Free on the public repo.
#
# Triggered on release tags (v*.*.*) and manually via workflow_dispatch.
# The smoke script (scripts/smoke_mcp.py) derives the expected tool count from
# the server source at runtime -- never a hardcoded number -- and fails the
# job (exit 1) on any mismatch or round-trip failure.

name: cross-platform-smoke

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package (+ server extra)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[server]"

      - name: Smoke test the MCP server over stdio
        run: python scripts/smoke_mcp.py --product loreconvo
