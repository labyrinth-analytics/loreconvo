name: LanceDB compatibility

on:
  push:
    paths:
      - 'src/core/hybrid_search.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'tests/test_lancedb_integration.py'
      - 'tests/test_dependency_compatibility.py'
      - '.github/workflows/lancedb-compatibility.yml'
  pull_request:
    paths:
      - 'src/core/hybrid_search.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'tests/test_lancedb_integration.py'
      - 'tests/test_dependency_compatibility.py'
      - '.github/workflows/lancedb-compatibility.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        lancedb: ['0.30.2', '0.32.0', '0.33.0', '0.34.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the selected engine with the package
        run: python -m pip install '.[dev]' 'lancedb==${{ matrix.lancedb }}'
      - name: Check the installed dependency closure
        run: python -m pip check
      - name: Exercise the hybrid index without a model download
        run: python -m pytest -q tests/test_lancedb_integration.py tests/test_dependency_compatibility.py
