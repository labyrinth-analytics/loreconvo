name: loreconvo
version: "0.10.20"
description: "LoreConvo — cross-surface persistent session memory with search, recall, and structured memory items."
python_dependencies:
  - "loreconvo==0.10.20"
requires_env:
  - name: LORECONVO_HERMES_PROJECT
    description: "Default project name for LoreConvo sessions created by Hermes"
    required: false
    default: "hermes"
  - name: LORECONVO_PRO
    description: "Pro license key (LAB-... format).  Activate Pro tier for Hermes-native access to Pro-only tools (semantic search, export, etc.)."
    required: false
    default: ""